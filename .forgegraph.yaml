# Cloud tier on Cloudflare Workers. med.gmac.io is a legacy hostname on the same Worker
# and 301s to hospital.gmac.io. The labnuc site fleet (hospital.mackie.house) deploys
# with deploy/site/labnuc/push.sh; ForgeGraph has no celld target yet.
app: hospital-fabric
stages:
  - name: production
    url: https://hospital.gmac.io
    targets:
      - name: worker
        platform: cloudflare-workers
        config:
          workerName: hospital-fabric-cloud
          appDir: "."
          buildCommand: npm run build:cloud
          deployCommand: npx wrangler deploy --config apps/worker/dist/wrangler.json --keep-vars
          syncSecrets: "false"
health:
  url: https://hospital.gmac.io/healthz
  interval: 60
  timeout: 10
