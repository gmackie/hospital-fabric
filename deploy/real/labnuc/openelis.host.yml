# labnuc is a shared homelab host: every service has a hard memory cap and no swap.
# Loopback ports match hetzner-master; tailnet access is added by tailnet.sh, never the LAN.
services:
  certs:
    platform: !reset null
    container_name: hf-oe-certs
    entrypoint: /bin/true
    command: []
    mem_limit: 64m
    memswap_limit: 64m
  db.openelis.org:
    platform: !reset null
    container_name: hf-openelis-database
    mem_limit: 512m
    memswap_limit: 512m
  oe.openelis.org:
    platform: !reset null
    container_name: hf-openelis-webapp
    depends_on: !override
      certs: {condition: service_completed_successfully}
      db.openelis.org: {condition: service_healthy}
    networks: !override {default: {}}
    mem_limit: 2304m
    memswap_limit: 2304m
    cpus: 2
    environment:
      JAVA_OPTS: "-Xms256m -Xmx1408m"
  fhir.openelis.org:
    platform: !reset null
    container_name: hf-openelis-fhir
    depends_on: !override
      certs: {condition: service_completed_successfully}
      db.openelis.org: {condition: service_healthy}
    ports: !override ["127.0.0.1:18091:8080"]
    mem_limit: 1280m
    memswap_limit: 1280m
    cpus: 2
    volumes:
      - /etc/hospital-fabric/products/fhir-server.xml:/usr/local/tomcat/conf/server.xml:ro
    environment:
      JAVA_TOOL_OPTIONS: "-Xms128m -Xmx896m"
  frontend.openelis.org:
    platform: !reset null
    container_name: hf-openelis-frontend
    mem_limit: 256m
    memswap_limit: 256m
  proxy:
    entrypoint: ["/bin/sh", "/hf-proxy.sh"]
    command: []
    platform: !reset null
    container_name: hf-openelis-proxy
    depends_on: !override [certs, oe.openelis.org, frontend.openelis.org]
    mem_limit: 128m
    memswap_limit: 128m
    volumes:
      - /var/lib/hospital-fabric/products/release/deploy/real/hetzner-master/nginx.conf:/hf-nginx.conf:ro
      - /var/lib/hospital-fabric/products/release/deploy/real/hetzner-master/openelis-proxy.sh:/hf-proxy.sh:ro
      - /etc/hospital-fabric/products/ca.crt:/etc/nginx/hf-ca.crt:ro
    ports: !override ["127.0.0.1:18092:80", "127.0.0.1:18443:443"]
  source-db:
    image: ${OE_DATABASE_IMAGE:?Pinned source database image required}
    container_name: hf-openelis-source-database
    restart: unless-stopped
    env_file: [./volume/database/database.env]
    mem_limit: 512m
    memswap_limit: 512m
    environment:
      POSTGRES_PASSWORD: ${OE_POSTGRES_PASSWORD:?Private database owner password required}
      DB_PASSWORD: ${OE_DB_PASSWORD:?Private database password required}
      DB_SUPERUSER_PASSWORD: ${ADMIN_PASSWORD:?Private database admin password required}
    volumes: [source-db-data:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD, pg_isready, -q, -d, clinlims, -U, clinlims]
      interval: 10s
      timeout: 5s
      retries: 10
  hf-source-fhir:
    image: ${OE_FHIR_IMAGE:?Pinned source FHIR image required}
    container_name: hf-openelis-source-fhir
    restart: unless-stopped
    # Postgres must accept connections first: HAPI does not retry a failed startup.
    depends_on: !override {source-db: {condition: service_healthy}}
    ports: ["127.0.0.1:18093:8080"]
    mem_limit: 1280m
    memswap_limit: 1280m
    cpus: 2
    volumes:
      - key_trust-store-volume:/etc/openelis-global
      - /etc/hospital-fabric/products/fhir-server.xml:/usr/local/tomcat/conf/server.xml:ro
    environment:
      JAVA_TOOL_OPTIONS: "-Xms128m -Xmx896m"
      CATALINA_OPTS: "-Dhapi.ssl.truststorepath=/etc/openelis-global/truststore -Dhapi.ssl.truststorepassword=${SSL_TRUSTSTORE_PASSWORD} -Dhapi.ssl.keystorepath=/etc/openelis-global/keystore -Dhapi.ssl.keystorepassword=${SSL_KEYSTORE_PASSWORD}"
      FHIR_DATASOURCE_URL: "jdbc:postgresql://source-db:5432/clinlims?currentSchema=clinlims"
      FHIR_DATASOURCE_USERNAME: clinlims
      FHIR_DATASOURCE_PASSWORD: ${OE_DB_PASSWORD:?Private database password required}
      FHIR_SERVER_ADRESS: "http://hf-source-fhir:8080/fhir/"
      HAPI_FHIR_CLIENT_ID_STRATEGY: "ANY"
networks:
  default:
    ipam: !reset null
volumes:
  db-data:
    driver_opts: {type: none, o: bind, device: /var/lib/hospital-fabric/products/data/openelis-db}
  key_trust-store-volume:
    driver_opts: {type: none, o: bind, device: /var/lib/hospital-fabric/products/data/openelis-keystores}
  certs-vol:
    driver_opts: {type: none, o: bind, device: /var/lib/hospital-fabric/products/data/openelis-certs}
  keys-vol:
    driver_opts: {type: none, o: bind, device: /var/lib/hospital-fabric/products/data/openelis-keys}
  reporting-data:
    driver_opts: {type: none, o: bind, device: /var/lib/hospital-fabric/products/data/openelis-reports}
  source-db-data:
    driver_opts: {type: none, o: bind, device: /var/lib/hospital-fabric/products/data/openelis-source-db}
