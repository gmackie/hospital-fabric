worker_processes 1;
events { worker_connections 1024; }
http {
  server {
    listen 80;
    server_name localhost;
    return 301 https://localhost:18443$request_uri;
  }
  server {
    listen 443 ssl;
    server_name localhost;
    ssl_certificate /etc/nginx/certs/apache-selfsigned.crt;
    ssl_certificate_key /etc/nginx/keys/apache-selfsigned.key;
    location / { proxy_pass http://frontend.openelis.org; }
    location /api/ {
      proxy_pass https://oe.openelis.org:8443/api/;
      proxy_ssl_certificate /etc/nginx/certs/apache-selfsigned.crt;
      proxy_ssl_certificate_key /etc/nginx/keys/apache-selfsigned.key;
      proxy_ssl_trusted_certificate /etc/nginx/hf-ca.crt;
      proxy_ssl_verify on;
      proxy_ssl_server_name on;
      proxy_ssl_name oe.openelis.org;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto https;
    }
  }
}
